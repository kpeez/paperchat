[project]
name = "paperchat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
paperchat = "paperchat_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paperchat_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
