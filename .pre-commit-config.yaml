repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
        exclude: ^backend/tests/fixtures/docling_validation/.*\.pdf$
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: mixed-line-ending
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-executables-have-shebangs

  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --project backend ruff check
        language: system
        files: ^backend/.*\.pyi?$
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format --check
        language: system
        files: ^backend/.*\.pyi?$
